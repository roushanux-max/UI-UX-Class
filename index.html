<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI UX Class Presentation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Interactive 10-day UX Design Sprint platform with daily knowledge check quizzes, Google Authentication, automatic system light/dark theme adaptation, college fieldwork briefs, and role-based access control." />
    <meta property="og:title" content="UI UX Class Presentation" />
    <meta property="og:description" content="Interactive 10-day UX Design Sprint platform with daily knowledge check quizzes, Google Authentication, automatic system light/dark theme adaptation, college fieldwork briefs, and role-based access control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('uiux_theme_mode');
          var isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
